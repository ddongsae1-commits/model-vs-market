# 하루 10번 도는 갱신 작업. 파일은 이거 하나입니다.
# cron 은 UTC 기준이라 한국시간에서 9시간을 뺀 값입니다.
name: 갱신

on:
  schedule:
    # 15분마다 깨어나서 "지금 할 일이 있나"만 봅니다. 없으면 20초쯤 돌고 끝납니다.
    # 공개 저장소는 실행 시간이 무료라 자주 깨워도 비용이 안 듭니다.
    # 고정 시간표를 안 쓰는 이유: 깃허브 예약은 5~30분씩 밀리는데, 고정 시각에
    # 매달리면 밀린 스냅샷은 그냥 날아갑니다. 자주 깨워서 스스로 판단하게 두면
    # 밀려도 다음 체크가 만회합니다.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "손으로 돌릴 때 고르는 작업 (비우면 지금 시각에 맞춰 자동)"
        required: false
        default: ""
        type: choice
        options: ["", "A", "B", "C", "D", "E", "F", "G", "H", "I"]

# 앞 런이 안 끝났는데 다음 런이 겹쳐 돌면 data/ 가 꼬입니다. 줄 세웁니다.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 갱신 실행
        env:
          # 배당 API 키. 저장소에는 없고 GitHub 비밀값에서만 옵니다.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/run.py "${{ github.event.inputs.slot }}"

      - name: 바뀐 것만 커밋
        run: |
          git config user.name  "mvm-bot"
          git config user.email "mvm-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "바뀐 게 없습니다 (예정된 일 없는 시각이거나 경기가 없는 날)"
          else
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
